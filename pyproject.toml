[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mnq-research"
version = "0.1.0"
description = "Readable MNQ strategy research using NautilusTrader"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nautilus_trader==1.231.0",
  "streamlit==1.65.0",
  "pydantic==2.13.5",
  "PyYAML==6.0.3",
  "plotly>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0", "mypy==2.4.0", "types-PyYAML"]

[project.scripts]
mnq = "mnq_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/mnq_research/config.py", "src/mnq_research/risk.py", "src/mnq_research/rules.py", "src/mnq_research/criteria.py", "src/mnq_research/rule_engine.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools.package-data]
mnq_research = ["chart_assets/*"]
